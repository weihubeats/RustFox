name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 Git tag（手动触发时必填，如 v0.0.7；tag 须已推送）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # tag 触发用 tag 名；workflow_dispatch 时 GITHUB_REF_NAME 是分支名（如 main），
  # 会产出 "main" 这种非 semver 版本号导致 updater 解析失败，故必须用 inputs.tag。
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos-arm
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 门禁：tag 必须与 tauri.conf.json / package.json 版本一致，
      # 否则 updater 清单与产物命名会互相矛盾。放在装依赖之前，失败即快速退出。
      - name: 校验 tag 与版本一致
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CONF_VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::tag ${RELEASE_TAG} 与 frontend/src-tauri/tauri.conf.json 的 version (${CONF_VERSION}) 不一致"
            echo "::error::请运行 node scripts/release.mjs bump <version> 统一后再打标签"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${RELEASE_TAG} 与 frontend/package.json 的 version (${PKG_VERSION}) 不一致"
            exit 1
          fi
          echo "✓ tag / tauri.conf.json / package.json 版本一致：${TAG_VERSION}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/fox-tauri -> frontend/src-tauri/target"
          key: shell

      - name: Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 规避 Azure Ubuntu 镜像不可达（CI 偶发 apt-get update 卡死）
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources

      - name: Install Linux dependencies (WebKit/GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Build Tauri bundle
        shell: bash
        run: scripts/package-tauri.sh
        env:
          # updater 产物签名密钥（tauri signer generate 生成，见 docs/UPDATER.md）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename macOS updater artifacts (arch suffix)
        if: startsWith(matrix.name, 'macos')
        shell: bash
        run: |
          # arm/intel 两个构建的更新产物同名（RustFox.app.tar.gz），必须加架构后缀防覆盖
          ARCH="${{ matrix.name == 'macos-arm' && 'aarch64' || 'x64' }}"
          MAC_DIR="frontend/src-tauri/target/release/bundle/macos"
          mv "$MAC_DIR/RustFox.app.tar.gz" "$MAC_DIR/RustFox_${RELEASE_TAG#v}_$ARCH.app.tar.gz"
          mv "$MAC_DIR/RustFox.app.tar.gz.sig" "$MAC_DIR/RustFox_${RELEASE_TAG#v}_$ARCH.app.tar.gz.sig"

      - name: Upload artifacts (job)
        uses: actions/upload-artifact@v4
        with:
          name: rustfox-${{ matrix.name }}
          # 只上传分发产物本身；整目录上传会把 .app/AppDir 内部文件平铺成垃圾资产
          path: |
            frontend/src-tauri/target/release/bundle/macos/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz
            frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/deb/*.deb.sig
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/rpm/*.rpm.sig
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/msi/*.msi.sig
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: ls -laR artifacts

      - name: Delete existing release for this tag (retry safety)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ env.RELEASE_TAG }}" --yes || true

      - name: Generate latest.json (updater manifest)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          sig_of() { cat "artifacts/$1.sig" 2>/dev/null | tr -d '\n' || true; }

          # 各平台 updater 产物（download-artifact 已剥掉 bundle/ 前缀）
          MAC_ARM_PKG="$(cd artifacts && ls macos/*_aarch64.app.tar.gz 2>/dev/null | head -1 || true)"
          MAC_INTEL_PKG="$(cd artifacts && ls macos/*_x64.app.tar.gz 2>/dev/null | head -1 || true)"
          LINUX_PKG="$(cd artifacts && ls appimage/*_amd64.AppImage 2>/dev/null | head -1 || true)"
          WIN_PKG="$(cd artifacts && ls nsis/*_x64-setup.exe 2>/dev/null | head -1 || true)"
          echo "mac-arm=$MAC_ARM_PKG mac-intel=$MAC_INTEL_PKG linux=$LINUX_PKG win=$WIN_PKG"

          python3 - "$VERSION" "$BASE" "$MAC_ARM_PKG" "$MAC_INTEL_PKG" "$LINUX_PKG" "$WIN_PKG" <<'EOF'
          import json, pathlib, sys
          from datetime import datetime, timezone
          version, base, mac_arm, mac_intel, linux, win = sys.argv[1:7]

          def entry(rel):
              if not rel:
                  return None
              rel = pathlib.Path(rel).as_posix()
              name = rel.split("/")[-1]
              sig_file = pathlib.Path("artifacts") / (rel + ".sig")
              sig = sig_file.read_text().strip() if sig_file.exists() else ""
              return {"url": f"{base}/{name}", "signature": sig}

          platforms = {
              "darwin-aarch64": entry(mac_arm),
              "darwin-x86_64": entry(mac_intel),
              "linux-x86_64": entry(linux),
              "windows-x86_64": entry(win),
          }
          manifest = {
              "version": version,
              "notes": "详见 Release Notes",
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": {k: v for k, v in platforms.items() if v},
          }
          if not manifest["platforms"]:
              sys.exit("未找到任何 updater 产物（.app.tar.gz / .AppImage / -setup.exe）")
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2))
          print(pathlib.Path("latest.json").read_text())
          EOF

      - name: 生成变更日志（conventional commits → Release body）
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            python3 - "$PREV_TAG" <<'PYEOF' > changelog.md
          import re, subprocess, sys
          prev = sys.argv[1]
          raw = subprocess.run(
              ["git", "log", "--no-merges", "--pretty=format:%s", f"{prev}..HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.split("\n")
          groups = [
              ("feat", "新功能"),
              ("fix", "修复"),
              ("perf", "性能优化"),
              ("refactor", "重构"),
              ("docs", "文档"),
              ("test", "测试"),
              ("build", "构建"),
              ("ci", "CI"),
              ("chore", "其他改动"),
              ("revert", "回退"),
          ]
          out = {t: [] for t, _ in groups}
          for line in raw:
              if not line or line.startswith("chore(release):"):
                  continue
              m = re.match(
                  r"^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]*\))?:\s*(.*)", line
              )
              if m:
                  out[m.group(1)].append(m.group(3))
          if not any(out.values()):
              print("- 无代码变更（仅发布流程/版本号调整）")
          else:
              for typ, label in groups:
                  if out[typ]:
                      print(f"### {label}")
                      print("\n".join(f"- {m}" for m in out[typ]))
                      print()
          PYEOF
          else
            echo '- 首个正式发布版本' > changelog.md
          fi
          {
            echo "### RustFox ${RELEASE_TAG#v} 更新内容"
            echo
            cat changelog.md
            echo
            echo '---'
            echo
            echo '## 分发包（Tauri 2）'
            echo
            echo '- **Windows**: `RustFox_x.x.x_x64-setup.exe`（NSIS 安装包）或 `RustFox_x.x.x_x64_en-US.msi`'
            echo '- **macOS**: `RustFox_x.x.x_aarch64.dmg`（Apple Silicon）或 `RustFox_x.x.x_x64.dmg`（Intel）'
            echo '  —— 首次打开若提示「已损坏」，执行 `xattr -cr /Applications/RustFox.app` 解除隔离（未做 Apple 公证的正常现象，详见使用手册）'
            echo '- **Linux**: `rustfox_x.x.x_amd64.deb` 与 `.AppImage`'
            echo
            echo "使用手册：[docs/USER_GUIDE.md](https://github.com/\${GITHUB_REPOSITORY}/blob/\${RELEASE_TAG}/docs/USER_GUIDE.md)"
          } > release_body.md
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RustFox ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          files: |
            artifacts/**
            latest.json
          draft: true
          generate_release_notes: false
