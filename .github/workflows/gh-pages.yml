name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/USER_GUIDE.md"
      - "docs/en/USER_GUIDE.md"
      - "docs/MIGRATION.md"
      - "docs/en/MIGRATION.md"
      - "docs/AGENT.md"
      - "docs/en/AGENT.md"
      - "CHANGELOG.md"
      - "scripts/build_site_docs.mjs"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install doc generator deps
        run: npm ci --prefix scripts
      - name: Generate docs pages
        run: node scripts/build_site_docs.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
